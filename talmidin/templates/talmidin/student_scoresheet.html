<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
    <style>
      page {
        scroll-behavior: smooth;
      }
      .header {
        display: flex;
        height: 15vh;
        gap: 16px;
        justify-content: space-between;
      }
      .header-wrap {
        padding: 10px;
        display: flex;
        height: 100%;
        align-items: center;
        gap: 16px;
      }
      .header-logo {
        height: 100%;
        aspect-ratio: 1;
      }

      .btn {
        display: inline-block;
        background-color: brown;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        text-align: center;
        padding-inline: 16px;
        padding-block: 8px;
      }
      .hero {
        display: relative;
      }
      .hero-image {
        height: 50vh;
        width: 100%;
        display: block;
        object-fit: cover;
      }
      .hero-text {
        margin-top: 20px;
        font-size: 15px;
        color: Black;
        text-shadow: 0 0 50px white;
      }
    </style>
  </head>
  <body></body>
</html>
