<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Log in as</title>
    <style>
      body {
        background-color: antiquewhite;
      }
      .login-box {
        background-color: rgb(199, 186, 186);
        width: 400px;
        height: 70vh;
        padding: 30px;
        border-radius: 20px;
        position: absolute;
        top: 15%;
        left: 33%;
      }
      .btn {
        display: inline-block;
        background-color: brown;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        text-align: center;
        padding-block: 10px;
        margin-top: 10px;
        width: 400px;
      }
      .login-title {
        color: brown;
        font-style: italic;
        font-size: 40px;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h3 class="login-title">How would you like to sign in?</h3>
      <div class="btn">
        <a href="/teacher_login/" class="btn"> Log in as Staff</a>
      </div>
      <div class="btn">
        <a href="/student_login/" class="btn"> Log in as student </a>
      </div>
    </div>
  </body>
</html>
