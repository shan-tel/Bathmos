<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Class</title>
</head>
<body>

    <form method="POST" action="/subject_select/">
    {% csrf_token %}
    <select name="class_id">
    {% for class in classes %}
        <option value="{{ class.id }}">{{ class.name }}</option>
    {% endfor %}
</select>
    <button type="submit">Next</button>
</form>

</body>
</html>
