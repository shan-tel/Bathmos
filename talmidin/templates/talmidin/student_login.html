<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Student Log In</title>
    <style>
      .student-login-box {
        background-color: rgb(199, 186, 186);
        width: 400px;
        height: 70vh;
        padding: 30px;
        border-radius: 20px;
        position: absolute;
        top: 15%;
        left: 33%;
      }
      .student-login-title {
        color: brown;
        font-style: italic;
        font-size: 40px;
      }
      body {
        background-color: antiquewhite;
      }
    </style>
  </head>
  <body>
    <div class="student-login-box">
      <h3 class="student-login-title">Student Log in Page</h3>
      <form method="POST" action="">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Log in</button>
      </form>
    </div>
  </body>
</html>
